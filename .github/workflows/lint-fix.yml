name: Auto-fix code quality problems
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run oxlint
        run: pnpm exec oxlint --fix .
      # *.astro files not formatted until Astro support (oxc#19715)
      - name: Run oxfmt
        run: pnpm exec oxfmt .
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: Auto-fix code quality problems
          author_name: ${{ github.actor }}
          author_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
